<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bitácora de Viajes</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a2e52">
<meta name="application-name" content="Bitácoras">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bitácoras">
<link rel="icon" href="icono-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icono-apple.png">
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Alfa+Slab+One&family=Pacifico&family=Bebas+Neue&family=Rye&family=Lato:ital,wght@0,400;0,700;0,900;1,400&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<script>
/* Librerías: primero la copia local de la carpeta (para uso sin conexión),
   y si no está, se descargan de internet. */
(function () {
  const js = (local, cdn) => {
    const s = document.createElement('script');
    s.src = local;
    s.onerror = () => { const c = document.createElement('script'); c.src = cdn; document.head.appendChild(c); };
    document.head.appendChild(s);
  };
  const css = (local, cdn) => {
    const l = document.createElement('link');
    l.rel = 'stylesheet'; l.href = local;
    l.onerror = () => { l.onerror = null; l.href = cdn; };
    document.head.appendChild(l);
  };
  css('lib/leaflet.css', 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css');
  js('lib/leaflet.js', 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js');
  js('lib/jszip.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js');
})();
</script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#061a30; --panel:#0a2e52; --accent:#d4a017; --accent2:#f5c842;
  --paper:#f5ead5; --ink:#1a1208; --line:#8b6914; --alt:#1a6b9a;
  --ok:#1a5c1a; --ok-bg:#d4edda; --warn:#c0392b;
  --display:'Pirata One',cursive;
}
body{background:var(--bg);color:var(--ink);font-family:'Lato',sans-serif;font-size:16px;line-height:1.6;min-height:100vh}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:radial-gradient(1px 1px at 10% 15%,rgba(255,255,255,.5),transparent),radial-gradient(1px 1px at 30% 40%,rgba(255,255,255,.35),transparent),radial-gradient(1.5px 1.5px at 55% 20%,rgba(255,255,255,.45),transparent),radial-gradient(1px 1px at 75% 60%,rgba(255,255,255,.25),transparent),radial-gradient(1px 1px at 90% 10%,rgba(255,255,255,.45),transparent),radial-gradient(1px 1px at 20% 80%,rgba(255,255,255,.3),transparent),radial-gradient(1px 1px at 85% 85%,rgba(255,255,255,.35),transparent)}
body.theme-playa::before,body.theme-ciudad::before{opacity:.25}

button{font-family:inherit;cursor:pointer}
a{color:var(--panel)}

/* ───── TOP BAR ───── */
.topbar{position:sticky;top:0;z-index:60;display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;
  background:rgba(4,14,26,.96);border-bottom:2px solid var(--accent);padding:.45rem .7rem;backdrop-filter:blur(6px)}
.topbar-label{color:var(--accent2);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.tb-btn{background:#123a5e;color:#dbe9f4;border:1px solid #2a5f8a;border-radius:6px;padding:.3rem .6rem;font-size:.75rem}
.tb-btn:hover{background:#1a4e7a}
.tb-btn.primary{background:var(--accent);color:#1a1208;border-color:var(--accent2);font-weight:700}
.tb-btn.connected{background:#14532d;border-color:#2f8a4d;color:#c8f0d5}
.tb-status{font-size:.72rem;color:#8fc7a5;margin-left:auto;transition:opacity .4s;max-width:100%;word-break:break-word}
.tb-status.err{color:#f5a3a3}
.tb-version{background:#0d2740;color:#7fa8c9;border:1px solid #2a5f8a;border-radius:999px;
  padding:.2rem .5rem;font-size:.68rem;letter-spacing:.04em;font-weight:700}
.tb-version:hover{background:#123a5e;color:#dbe9f4}
.tb-version.nueva{background:var(--accent);color:#1a1208;border-color:var(--accent2);animation:late 1.4s ease-in-out infinite}
@keyframes late{50%{opacity:.55}}
.hidden-input{display:none}

/* ───── LIBRARY ───── */
.library{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:2.5rem 1rem 4rem}
.lib-title{font-family:var(--display);font-size:clamp(2.1rem,7vw,3.4rem);color:var(--accent2);text-align:center;
  text-shadow:0 2px 12px rgba(0,0,0,.8)}
.lib-sub{text-align:center;color:#a8cce0;font-style:italic;margin:.2rem 0 2rem}
.lib-empty{background:var(--paper);border:3px solid var(--line);border-radius:12px;padding:1.6rem;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.4)}
.lib-empty h2{font-family:var(--display);color:var(--panel);font-size:1.5rem;margin-bottom:.5rem}
.lib-empty p{font-size:.92rem;margin-bottom:.5rem}
.lib-empty code{background:#0000000f;padding:.1rem .3rem;border-radius:4px;font-size:.85rem}
.lib-empty .tb-btn{margin-top:1rem;padding:.6rem 1.1rem;font-size:.9rem}
.trip-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:1rem}
.trip-card{background:var(--paper);border:3px solid var(--line);border-radius:12px;overflow:hidden;
  box-shadow:0 4px 18px rgba(0,0,0,.45);text-align:left;padding:0;display:flex;flex-direction:column;transition:transform .15s}
.trip-card:hover{transform:translateY(-3px)}
.trip-cover{height:120px;background:var(--panel);display:flex;align-items:center;justify-content:center;font-size:3rem;position:relative;overflow:hidden}
.trip-cover img{width:100%;height:100%;object-fit:cover}
.trip-cover .badge{position:absolute;top:.4rem;right:.4rem;background:rgba(0,0,0,.55);color:#fff;font-size:.62rem;
  letter-spacing:.08em;text-transform:uppercase;padding:.15rem .4rem;border-radius:4px}
.trip-body{padding:.7rem .8rem 1rem}
.trip-name{font-family:var(--display);font-size:1.35rem;color:var(--panel);line-height:1.1}
.trip-dates{font-size:.78rem;color:#6b5a3a;font-style:italic;margin-bottom:.5rem}
.trip-meta{font-size:.75rem;color:#4a4033;display:flex;gap:.7rem;flex-wrap:wrap}
.mini-bar{height:6px;background:#0000001a;border-radius:3px;margin-top:.5rem;overflow:hidden}
.mini-bar span{display:block;height:100%;background:var(--accent);border-radius:3px}
.lib-group{margin-bottom:1.9rem}
.lib-group-head{display:flex;align-items:center;gap:.5rem;margin-bottom:.7rem;padding-bottom:.35rem;border-bottom:1px solid #ffffff26}
.lib-group-title{font-family:var(--display);font-size:1.2rem;color:var(--accent2);letter-spacing:.03em}
.lib-group-count{font-size:.68rem;color:#a8cce0;background:#ffffff1a;border-radius:10px;padding:.12rem .5rem}
.trip-card .estado{position:absolute;top:.4rem;left:.4rem;font-size:.6rem;font-weight:800;letter-spacing:.06em;
  text-transform:uppercase;border-radius:20px;padding:.15rem .5rem;color:#fff;background:rgba(0,0,0,.55)}
.estado.curso{background:#1e8449}
.estado.pendiente{background:#8a6d1f}
.trip-card.pendiente{opacity:.92}
.trip-card.pendiente .trip-cover{filter:saturate(.5)}

/* ───── HEADER ───── */
header{position:relative;z-index:1;background:linear-gradient(180deg,#040e1a 0%,var(--panel) 70%,var(--alt) 100%);
  border-bottom:4px solid var(--accent);text-align:center;overflow:hidden}
.hero-art{width:min(320px,78vw);margin:1.6rem auto 0;display:block;filter:drop-shadow(0 4px 18px rgba(0,0,0,.5))}
.header-title{font-family:var(--display);font-size:clamp(2rem,7vw,3.6rem);color:var(--accent2);
  text-shadow:0 2px 12px rgba(0,0,0,.8);margin-top:.8rem;letter-spacing:.03em}
.header-sub{color:#c4dcea;font-style:italic;font-size:1rem;margin:.25rem 0 .4rem}
.header-crew{color:var(--accent);font-size:.85rem;letter-spacing:.09em;text-transform:uppercase;padding-bottom:.6rem}
.header-wave{width:100%;height:44px;display:block;margin-top:.8rem}

main{position:relative;z-index:1;max-width:820px;margin:0 auto;padding:1.6rem 1rem 5rem}
.section-heading{font-family:var(--display);font-size:1.7rem;color:var(--accent2);margin:2rem 0 .8rem;
  display:flex;align-items:center;gap:.5rem;border-bottom:2px solid var(--accent);padding-bottom:.3rem}

/* ───── PANELS ───── */
.panel{background:var(--paper);border:3px solid var(--line);border-radius:12px;padding:1.2rem;margin-bottom:1.2rem;
  box-shadow:0 4px 20px rgba(0,0,0,.4);position:relative;overflow:hidden}
.panel-label{font-family:var(--display);font-size:1.25rem;color:var(--panel);margin-bottom:.7rem;display:flex;gap:.4rem;align-items:center}
.map-img{width:100%;border-radius:8px;border:2px solid var(--line);display:block}
#leaflet-map{width:100%;height:340px;border-radius:8px;border:2px solid var(--line);overflow:hidden;z-index:1}
.map-hint{font-size:.72rem;color:#7a6a52;font-style:italic;margin-top:.4rem;text-align:center}

.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.7rem}
.stat{background:#fff8ea;border:1px solid var(--line);border-radius:8px;padding:.6rem;text-align:center}
.stat-icon{font-size:1.4rem}
.stat-value{font-weight:900;color:var(--panel);font-size:1.05rem}
.stat-label{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:#7a6a52}
.stat-note{font-size:.72rem;color:#5c5142;font-style:italic;margin-top:.2rem}
.curio{display:flex;gap:.6rem;padding:.5rem 0;border-top:1px dashed #b9a577;font-size:.88rem}
.curio:first-of-type{border-top:none}
.curio-icon{font-size:1.2rem;flex:0 0 auto}

/* ───── PROGRESS ───── */
.progress-label{display:flex;justify-content:space-between;color:var(--accent2);font-size:.85rem;
  text-transform:uppercase;letter-spacing:.07em;margin:1.4rem 0 .3rem}
.progress-wrap{height:12px;background:#0d2033;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.progress-bar{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0;transition:width .4s}

/* ───── DAY CARD ───── */
.day-card{background:var(--paper);border:3px solid var(--line);border-radius:12px;margin-bottom:1.1rem;
  box-shadow:0 4px 16px rgba(0,0,0,.4);overflow:hidden}
.day-card.visited{border-color:var(--ok)}
.day-header{display:flex;gap:.7rem;padding:.8rem;cursor:pointer;align-items:stretch}
.day-num{flex:0 0 46px;background:var(--panel);color:var(--accent2);border-radius:8px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;font-family:var(--display);font-size:1.5rem;line-height:1}
.day-num small{font-size:.5rem;letter-spacing:.1em;color:#a8cce0;font-family:'Lato',sans-serif}
.day-body{display:flex;gap:.6rem;flex:1;align-items:flex-start}
.day-check{flex:0 0 26px;height:26px;border:2px solid var(--line);border-radius:50%;display:flex;align-items:center;
  justify-content:center;color:transparent;font-weight:900;margin-top:.2rem;transition:.2s}
.day-card.visited .day-check{background:var(--ok);border-color:var(--ok);color:#fff}
.day-date{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:#7a6a52}
.day-place{font-family:var(--display);font-size:1.3rem;color:var(--panel);line-height:1.15;display:flex;gap:.4rem;align-items:center;flex-wrap:wrap}
.day-badge{font-family:'Lato',sans-serif;font-size:.6rem;background:var(--panel);color:var(--accent2);padding:.1rem .4rem;
  border-radius:4px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.day-hours{font-size:.8rem;color:var(--warn);font-weight:700}
.day-note{font-size:.85rem;color:#4a4033;margin-top:.2rem}
.day-visited-tag{display:none;font-size:.65rem;background:var(--ok-bg);color:var(--ok);border-radius:4px;padding:.1rem .35rem;font-weight:700}
.day-card.visited .day-visited-tag{display:inline-block}

.toggle{width:100%;text-align:left;background:#eadfc4;border:none;border-top:1px solid var(--line);
  padding:.55rem .8rem;font-size:.85rem;font-weight:700;color:var(--panel);display:flex;gap:.4rem;align-items:center}
.toggle .arr{transition:transform .2s;font-size:.7rem}
.toggle.open .arr{transform:rotate(90deg)}
.toggle:hover{background:#e0d3b3}
.collapse{display:none;padding:.9rem;background:#fffaf0;border-top:1px solid #d9c99f}
.collapse.open{display:block}
.collapse p{margin-bottom:.6rem;font-size:.9rem}
.fun-fact{background:#fff3cd;border-left:4px solid var(--accent);padding:.6rem .7rem;border-radius:0 6px 6px 0;
  font-size:.87rem;font-style:italic;margin-bottom:.6rem}
.challenge{background:#e8f4fd;border-left:4px solid var(--alt);padding:.6rem .7rem;border-radius:0 6px 6px 0;font-size:.87rem;margin-bottom:.6rem}
.route-block{background:#fff;border:1px dashed var(--line);border-radius:8px;padding:.7rem;margin-top:.6rem}
.route-title{font-weight:900;color:var(--panel);font-size:.9rem;margin-bottom:.4rem}
.route-alert{background:#ffe9c9;border-radius:6px;padding:.35rem .5rem;font-size:.8rem;margin-bottom:.6rem}
.route-steps{list-style:none}
.route-step{display:flex;gap:.6rem;padding:.35rem 0;border-left:2px solid #e0d3b3;margin-left:11px;padding-left:.8rem;position:relative}
.step-dot{position:absolute;left:-13px;top:.4rem;width:22px;height:22px;border-radius:50%;background:var(--panel);color:#fff;
  font-size:.7rem;font-weight:900;display:flex;align-items:center;justify-content:center;border:2px solid var(--paper)}
.step-dot.transit{background:var(--alt)}
.step-time{font-weight:900;color:var(--warn);font-size:.8rem}
.step-place{font-weight:700;font-size:.88rem}
.step-desc{font-size:.8rem;color:#5c5142}

/* ───── HUNT ───── */
.hunt-badge{margin-left:auto;background:var(--panel);color:var(--accent2);border-radius:10px;padding:.05rem .45rem;font-size:.7rem}
.hunt-intro{font-size:.85rem;background:#fff3cd;border-radius:6px;padding:.5rem;margin-bottom:.7rem}
.statue-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:.7rem}
.statue-card{background:#fff;border:2px solid #d9c99f;border-radius:8px;padding:.6rem;position:relative;transition:.2s}
.statue-card.caught{border-color:var(--accent);background:#fffaeb;box-shadow:0 0 0 2px #f5c84255}
.statue-emoji{font-size:1.5rem}
.statue-name{font-weight:900;color:var(--panel);font-size:.9rem}
.statue-clue{font-size:.78rem;color:#5c5142;margin:.2rem 0 .35rem}
.statue-pts{font-size:.75rem;font-weight:700;color:var(--warn)}
.statue-btn{width:100%;margin-top:.4rem;background:var(--panel);color:#fff;border:none;border-radius:6px;padding:.35rem;font-size:.78rem}
.statue-card.caught .statue-btn{background:var(--ok)}
.statue-photo{margin-top:.4rem;position:relative}
.statue-photo img{width:100%;border-radius:6px;border:2px solid var(--accent);display:block}
.del-btn{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.65);color:#fff;border:none;border-radius:50%;
  width:22px;height:22px;font-size:.75rem;line-height:1}
.move-sel{width:100%;margin-top:.3rem;font-family:inherit;font-size:.72rem;padding:.22rem;border:1px solid #d9c99f;
  border-radius:5px;background:#fff8ea;color:#5c5142}
.hunt-score{margin-top:.7rem;text-align:center;font-weight:700;color:var(--panel);font-size:.85rem}

/* ───── JOURNAL & PHOTOS ───── */
.journal{padding:.9rem;background:#fffdf7;border-top:1px solid #d9c99f}
.journal-label{font-weight:900;color:var(--panel);font-size:.85rem;margin-bottom:.35rem}
textarea{width:100%;min-height:110px;border:2px solid #d9c99f;border-radius:8px;padding:.6rem;font-family:inherit;
  font-size:.9rem;resize:vertical;background:#fff}
textarea:focus{outline:none;border-color:var(--accent)}
.save-row{display:flex;gap:.5rem;align-items:center;margin-top:.4rem}
.save-btn{background:var(--panel);color:var(--accent2);border:none;border-radius:6px;padding:.35rem .8rem;font-size:.78rem;font-weight:700}
.saved-ok{color:var(--ok);font-size:.75rem;opacity:0;transition:opacity .3s}
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:.5rem;margin-top:.5rem}
.photo-thumb{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;border:2px solid #d9c99f}
.photo-thumb img{width:100%;height:100%;object-fit:cover;cursor:pointer}
.add-photo{aspect-ratio:1;border:2px dashed var(--line);border-radius:8px;background:#fff8ea;color:#7a6a52;
  display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.75rem;gap:.2rem}

/* ───── MOMENTOS Y HALLAZGOS DEL DÍA ───── */
.dm-list{display:grid;gap:.55rem;margin-top:.4rem}
.dm-item{background:#fff8ea;border:1px solid #d9c99f;border-left:4px solid var(--alt);border-radius:8px;padding:.55rem .7rem}
.dm-when{font-size:.74rem;color:#7a6a52;font-weight:700}
.dm-place{font-size:.88rem;color:var(--panel);font-weight:900}
.dm-text{font-size:.9rem;margin:.25rem 0;white-space:pre-wrap}
.dm-coord{font-size:.74rem;color:var(--alt);font-weight:700}
.dm-acts{display:flex;gap:.4rem;justify-content:flex-end;margin-top:.4rem}
.dm-acts button{background:#e6dbc0;color:var(--panel);border:1px solid #c9b98f;border-radius:6px;
  padding:.2rem .55rem;font-size:.72rem;font-weight:700}
.dm-add{width:100%;background:#fff8ea;border:2px dashed var(--line);color:#7a6a52;border-radius:8px;
  padding:.45rem;font-size:.8rem;font-weight:700;margin-top:.5rem}
.dm-form{background:#fff8ea;border:2px dashed var(--line);border-radius:10px;padding:.75rem;margin-top:.4rem}
.dm-form .fld{margin-bottom:.7rem}
.dm-form textarea{min-height:70px}
.dm-loc{background:#fff;border:2px solid #d9c99f;border-radius:8px;padding:.4rem .55rem;font-size:.8rem;
  font-weight:400;display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
/* mientras se espera el toque en el mapa */
#leaflet-map.picking{outline:3px solid var(--accent);cursor:crosshair}

/* ───── SCOREBOARD ───── */
.score-table{width:100%;border-collapse:collapse;font-size:.85rem}
.score-table th{background:var(--panel);color:var(--accent2);text-align:left;padding:.4rem .5rem;font-family:var(--display);font-weight:400;font-size:1rem}
.score-table td{padding:.35rem .5rem;border-bottom:1px solid #e0d3b3}
.score-table tr:last-child td{font-weight:900;border-top:2px solid var(--line);border-bottom:none}
.rank-box{margin-top:.9rem;text-align:center;background:var(--panel);color:var(--accent2);border-radius:8px;padding:.8rem}
.rank-box .rank-name{font-family:var(--display);font-size:1.6rem}

.score-bar{position:fixed;bottom:0;left:0;right:0;z-index:55;background:rgba(4,14,26,.95);color:var(--accent2);
  text-align:center;padding:.4rem;font-size:.8rem;border-top:2px solid var(--accent);backdrop-filter:blur(6px)}
.score-bar .sc{font-weight:900;color:#fff}


/* ───── MOMENTOS ───── */
.tabs{display:flex;gap:.4rem;justify-content:center;margin:0 0 1.2rem}
.tab{background:#123a5e;color:#a8cce0;border:1px solid #2a5f8a;border-radius:20px;padding:.35rem .95rem;font-size:.82rem}
.tab.on{background:var(--accent);color:#1a1208;border-color:var(--accent2);font-weight:700}
.tb-btn.big{display:block;margin:0 auto 1.2rem;padding:.6rem 1.2rem;font-size:.9rem}
.mom-list{display:grid;gap:.9rem}
.mom-card{background:var(--paper);border:3px solid var(--line);border-radius:12px;padding:.9rem;box-shadow:0 4px 16px rgba(0,0,0,.4)}
.mom-date{font-family:var(--display);font-size:1.15rem;color:var(--panel);line-height:1.2}
.mom-text{font-size:.92rem;margin:.4rem 0;white-space:pre-wrap}
.mom-photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:.4rem;margin:.5rem 0}
.mom-thumb{aspect-ratio:1;border-radius:8px;overflow:hidden;border:2px solid #d9c99f;background:#fff8ea}
.mom-thumb img{width:100%;height:100%;object-fit:cover;cursor:pointer}
.mom-actions{display:flex;gap:.4rem;justify-content:flex-end;margin-top:.5rem}
.mom-actions .tb-btn{background:#e6dbc0;color:var(--panel);border-color:#c9b98f}
.chips{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.3rem}
.chip{background:var(--panel);color:var(--accent2);border-radius:14px;padding:.15rem .6rem;font-size:.78rem;display:inline-flex;align-items:center;gap:.3rem}
.chip button{background:none;border:none;color:inherit;font-size:.75rem;padding:0;opacity:.75}
.chip button:hover{opacity:1}
.fld{display:block;font-weight:700;color:var(--panel);font-size:.85rem;margin-bottom:.9rem}
.fld input[type=text],.fld input[type=datetime-local],.fld textarea,.fld select{

  carretera:{ icon:'🚐', display:"'Rye',serif", art:'road',
    vars:{'--bg':'#241813','--panel':'#4a2c1e','--accent':'#c96a2b','--accent2':'#ffa552','--paper':'#f6e9d2','--line':'#8a5a30','--alt':'#a6763c','--warn':'#a83c2b'} },

const HERO_ART = {

};

/* ─── ESTADO GLOBAL ─── */
let rootHandle = null;      // carpeta raíz
let tripHandles = [];       // [{handle, meta}]
let tripDir = null;         // carpeta del viaje abierto
let D = null;               // JSON del viaje abierto
let urls = {};              // clave -> objectURL de la miniatura
let fullUrls = {};          // clave -> objectURL a tamaño completo (bajo demanda)
let pending = [];           // imágenes que no se pudieron leer
let saveTimer = null;

const el = id => document.getElementById(id);
const esc = s => (s == null ? '' : String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])));

function status(msg, isErr) {
  const s = el('status');
  s.textContent = msg; s.className = 'tb-status' + (isErr ? ' err' : ''); s.style.opacity = 1;
  if (!isErr) setTimeout(() => s.style.opacity = 0, 3200);
}

/* ─── IndexedDB: carpeta raíz + caché de miniaturas ─── */
let dbPromise = null;
function db() {
  if (!dbPromise) dbPromise = new Promise((res, rej) => {
    const r = indexedDB.open('bitacora-fs', 2);
    r.onupgradeneeded = () => {
      const d = r.result;
      if (!d.objectStoreNames.contains('h')) d.createObjectStore('h');
      if (!d.objectStoreNames.contains('thumbs')) d.createObjectStore('thumbs');
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  return dbPromise;
}
function idbGet(store, key) {
  return db().then(d => new Promise((res, rej) => {
    const q = d.transaction(store).objectStore(store).get(key);
    q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
  }));
}
function idbSet(store, key, val) {
  return db().then(d => new Promise((res, rej) => {
    const t = d.transaction(store, 'readwrite');
    t.objectStore(store).put(val, key);
    t.oncomplete = () => res(); t.onerror = () => rej(t.error);
  }));
}
function idbDel(store, key) {
  return db().then(d => new Promise(res => {
    const t = d.transaction(store, 'readwrite');
    t.objectStore(store).delete(key); t.oncomplete = () => res(); t.onerror = () => res();
  }));
}
const rememberRoot = h => idbSet('h', 'root', h).catch(() => {});
const recallRoot   = () => idbGet('h', 'root').catch(() => null);

async function ensurePermission(handle, mode = 'readwrite') {
  if (!handle) return false;
  try {
    if (await handle.queryPermission({ mode }) === 'granted') return true;
    return (await handle.requestPermission({ mode })) === 'granted';
  } catch (_) { return false; }
}

/* ─── CARPETA RAÍZ Y ESCANEO DE VIAJES ─── */
let pickerBusy = false;
async function pickRoot() {
  if (!('showDirectoryPicker' in window)) {
    status('Este navegador no permite abrir carpetas. Usa Chrome o Edge en ordenador.', true); return;
  }
  if (pickerBusy) { status('Ya hay un selector de carpetas abierto'); return; }
  pickerBusy = true;
  try {
    rootHandle = await window.showDirectoryPicker({ mode: 'readwrite', id: 'bitacoras', startIn: 'documents' });
    await rememberRoot(rootHandle);
    el('btn-root').textContent = '📁 ' + rootHandle.name;
    el('btn-root').classList.add('connected');
    await scanTrips(); showLibrary();
  } catch (e) {
    if (e.name !== 'AbortError') status('No se pudo abrir la carpeta: ' + e.message, true);
  } finally { pickerBusy = false; }
}

/* ─── ESTADO DE UN VIAJE: pendiente · en curso · hecho ───
   Manda trip.status si está puesto; si no, se deduce de las fechas. */
const GRUPOS = [
  { key: 'curso',     titulo: 'En curso',   icon: '⛵' },
  { key: 'pendiente', titulo: 'Pendientes', icon: '🗓' },
  { key: 'hecho',     titulo: 'Hechos',     icon: '✓' }
];
const ORDEN = { curso: 0, pendiente: 1, hecho: 2 };
const ALIAS = {
  pendiente: 'pendiente', pendientes: 'pendiente', backlog: 'pendiente', idea: 'pendiente', pending: 'pendiente',
  curso: 'curso', 'en curso': 'curso', activo: 'curso', active: 'curso',
  hecho: 'hecho', hecha: 'hecho', hechos: 'hecho', done: 'hecho', completado: 'hecho', terminado: 'hecho'
};

function hoyISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

function tripStatus(data) {
  const tr = data.trip || {};
  const manual = ALIAS[String(tr.status || '').trim().toLowerCase()];
  if (manual) return manual;
  const start = tr.startDate || '';
  if (!start) return 'pendiente';          // idea de backlog sin fechas todavía
  const end = tr.endDate || start, hoy = hoyISO();
  if (hoy < start) return 'pendiente';
  if (hoy > end) return 'hecho';
  return 'curso';
}

function cuantoFalta(start) {
  const dias = Math.round((new Date(start + 'T00:00:00') - new Date(hoyISO() + 'T00:00:00')) / 86400000);
  if (!isFinite(dias) || dias <= 0) return '';
  if (dias === 1) return 'mañana';
  if (dias < 31) return `en ${dias} días`;
  const meses = Math.round(dias / 30);
  if (meses < 12) return `en ${meses} ${meses === 1 ? 'mes' : 'meses'}`;
  const años = Math.round(dias / 365);
  return `en ${años} año${años === 1 ? '' : 's'}`;
}

async function scanTrips() {
  tripHandles = [];
  for await (const entry of rootHandle.values()) {
    if (entry.kind !== 'directory') continue;
    try {
      const fh = await entry.getFileHandle('bitacora.json');
      const data = JSON.parse(await (await fh.getFile()).text());
      tripHandles.push({ handle: entry, data, folder: entry.name, status: tripStatus(data) });
    } catch (_) { /* subcarpeta sin bitácora: se ignora */ }
  }
  tripHandles.sort((a, b) => {
    if (ORDEN[a.status] !== ORDEN[b.status]) return ORDEN[a.status] - ORDEN[b.status];
    const da = a.data.trip?.startDate || '', db = b.data.trip?.startDate || '';
    if (a.status === 'hecho') return db.localeCompare(da);   // los últimos viajes, arriba
    if (!da !== !db) return da ? -1 : 1;                     // las ideas sin fecha, al final
    return da.localeCompare(db);                             // lo más próximo, arriba
  });
}

/* ─── PANTALLA: BIBLIOTECA ─── */
function tripCard(t, i) {
  const tr = t.data.trip || {}, th = THEMES[tr.theme] || THEMES.crucero;
  const days = t.data.days || [], est = t.status;
  const vis = (t.data.visited || []).filter(Boolean).length;
  const pct = days.length ? Math.round(vis / days.length * 100) : 0;
  let pts = 0, caught = 0, max = 0, objetivos = 0;
  days.forEach((d, di) => (d.hunt?.items || []).forEach((it, ii) => {
    max += it.pts || 0; objetivos++;
    if ((t.data.caught || {})[di + '-' + ii]) { pts += it.pts || 0; caught++; }
  }));

  // un viaje pendiente no tiene progreso que enseñar: se muestra lo que trae preparado
  const falta = est === 'pendiente' ? cuantoFalta(tr.startDate || '') : '';
  const meta = est === 'pendiente'
    ? `<span>📅 ${days.length} día${days.length === 1 ? '' : 's'}</span>
       <span>🗿 ${objetivos} objetivo${objetivos === 1 ? '' : 's'}</span>
       ${falta ? `<span>⏳ ${falta}</span>` : ''}`
    : `<span>📍 ${vis}/${days.length}</span>
       <span>${th.icon} ${caught} captura${caught === 1 ? '' : 's'}</span>
       <span>⭐ ${pts}${max ? '/' + max : ''}</span>`;
  const pill = est === 'hecho' ? ''
    : `<span class="estado ${est}">${est === 'curso' ? 'en curso' : 'pendiente'}</span>`;

  return `<button class="trip-card ${est}" onclick="openTrip(${i})">
    <div class="trip-cover" id="cover-${i}" style="background:${th.vars['--panel']}">
      <span>${th.icon}</span>${pill}<span class="badge">${esc(tr.theme || 'viaje')}</span></div>
    <div class="trip-body">
      <div class="trip-name">${esc(tr.title || t.folder)}</div>
      <div class="trip-dates">${esc(tr.subtitle || '')}</div>
      <div class="trip-meta">${meta}</div>
      ${est === 'pendiente' ? '' : `<div class="mini-bar"><span style="width:${pct}%;background:${th.vars['--accent']}"></span></div>`}
    </div></button>`;
}

async function showLibrary() {
  tripDir = null; D = null;
  applyTheme('crucero');
  el('btn-pdf').style.display = el('btn-zip').style.display = 'none';
  el('btn-library').style.display = 'none';
  el('score-bar').style.display = 'none';

  if (!rootHandle) {
    el('app').innerHTML = `<div class="library">
      <div class="lib-title">Bitácoras de viaje</div>
      <div class="lib-sub">Un cuaderno de aventuras por cada viaje</div>
      <div class="lib-empty">
        <h2>Elige tu carpeta de viajes</h2>
        <p>Dentro de esa carpeta, cada viaje va en su propia subcarpeta con un archivo <code>bitacora.json</code> y sus fotos.</p>
        <p style="font-size:.82rem;color:#6b5a3a">Ejemplo:<br><code>Viajes/</code> → <code>Viajes/costa-fortuna-2026/bitacora.json</code></p>
        <button class="tb-btn primary" onclick="pickRoot()">📁 Elegir carpeta</button>
      </div></div>`;
    return;
  }
  el('btn-root').textContent = '📁 ' + rootHandle.name;
  el('btn-root').classList.add('connected');

  if (!tripHandles.length) {
    el('app').innerHTML = `<div class="library">
      <div class="lib-title">Bitácoras</div>
      ${tabs('viajes')}
      <div class="lib-sub">Ningún viaje encontrado en ${esc(rootHandle.name)}</div>
      <div class="lib-empty">
        <h2>Aún no hay bitácoras aquí</h2>
        <p>Crea una subcarpeta por viaje y pon dentro su <code>bitacora.json</code>. Vuelve y pulsa Actualizar.</p>
        <button class="tb-btn primary" onclick="refreshLibrary()">🔄 Actualizar</button>
        <button class="tb-btn" onclick="pickRoot()">Cambiar de carpeta</button>
      </div></div>`;
    return;
  }

  const grupos = GRUPOS.map(g => {
    const suyos = tripHandles.map((t, i) => ({ t, i })).filter(x => x.t.status === g.key);
    if (!suyos.length) return '';
    return `<div class="lib-group">
      <div class="lib-group-head">
        <span class="lib-group-title">${g.icon} ${g.titulo}</span>
        <span class="lib-group-count">${suyos.length}</span>
      </div>
      <div class="trip-grid">${suyos.map(x => tripCard(x.t, x.i)).join('')}</div>
    </div>`;
  }).join('');

  el('app').innerHTML = `<div class="library">
    <div class="lib-title">Bitácoras</div>
    ${tabs('viajes')}
    <div class="lib-sub">${tripHandles.length} viaje${tripHandles.length > 1 ? 's' : ''} en ${esc(rootHandle.name)} · <a href="#" onclick="refreshLibrary();return false" style="color:#a8cce0">actualizar</a></div>
    ${grupos}</div>`;

  // portadas
  tripHandles.forEach(async (t, i) => {
    const cover = t.data.trip?.coverImage;
    if (!cover) return;
    try {
      const fh = await t.handle.getFileHandle(cover);
      const url = URL.createObjectURL(await fh.getFile());
      const box = el('cover-' + i);
      if (box) box.insertAdjacentHTML('afterbegin', `<img src="${url}" alt="">`);
    } catch (_) {}
  });
}

async function refreshLibrary() { if (rootHandle) { await scanTrips(); showLibrary(); } }


/* ══════════════════════════════════════════════════════════
   MOMENTOS — instantes sueltos, fuera de los viajes
   Se guardan en <carpeta raíz>/Momentos/momentos.json
   ══════════════════════════════════════════════════════════ */
let momDir = null;      // carpeta Momentos
let M = null;           // { people: [], moments: [] }
let momDraft = null;    // momento en edición
let momUrls = {};       // archivo -> objectURL de su miniatura

function tabs(active) {
  const t = (id, icon, label) => `<button class="tab ${active === id ? 'on' : ''}" onclick="${id === 'viajes' ? 'showLibrary()' : 'showMoments()'}">${icon} ${label}</button>`;
  return `<div class="tabs">${t('viajes', '🧭', 'Viajes')}${t('momentos', '✨', 'Momentos')}</div>`;
}

async function loadMoments() {
  if (M) return M;
  momDir = await rootHandle.getDirectoryHandle('Momentos', { create: true });
  try {
    const fh = await momDir.getFileHandle('momentos.json');
    M = JSON.parse(await (await fh.getFile()).text());
  } catch (_) { M = { schemaVersion: 1, people: [], moments: [] }; }
  if (!Array.isArray(M.people)) M.people = [];
  if (!Array.isArray(M.moments)) M.moments = [];
  return M;
}

async function saveMoments() {
  if (!await ensurePermission(momDir)) { status('Sin permiso de escritura', true); return false; }
  await writeFile('momentos.json', new Blob([JSON.stringify(M, null, 2)], { type: 'application/json' }), momDir);
  return true;
}

const fmtDate = iso => {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  return d.toLocaleString('es-ES', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' });
};

/* ─── LISTA ─── */
async function showMoments() {
  tripDir = null; D = null; momDraft = null;
  applyTheme('crucero');
  el('btn-pdf').style.display = el('btn-zip').style.display = 'none';
  el('btn-library').style.display = 'none';
  el('score-bar').style.display = 'none';

  if (!rootHandle) { showLibrary(); return; }
  await loadMoments();

  const lista = M.moments.slice().sort((a, b) => (b.datetime || '').localeCompare(a.datetime || ''));
  const cuerpo = lista.length ? lista.map(m => {
    const gente = (m.people || []).map(p => `<span class="chip">${esc(p)}</span>`).join('');
    const fotos = (m.photos || []).map(f => `<div class="mom-thumb" id="mt-${esc(m.id)}-${esc(f)}"></div>`).join('');
    return `<div class="mom-card">
      <div class="mom-date">${esc(fmtDate(m.datetime))}</div>
      ${m.text ? `<div class="mom-text">${esc(m.text)}</div>` : ''}
      ${fotos ? `<div class="mom-photos">${fotos}</div>` : ''}
      ${gente ? `<div class="chips">${gente}</div>` : ''}
      <div class="mom-actions">
        <button class="tb-btn" onclick="editMoment('${esc(m.id)}')">✎ Editar</button>
        <button class="tb-btn" onclick="deleteMoment('${esc(m.id)}')">🗑 Borrar</button>
      </div></div>`;
  }).join('') : `<div class="lib-empty"><h2>Aún no hay momentos</h2>
      <p>Guarda aquí instantes sueltos: una cena, un primer diente, una tarde cualquiera que merece recordarse.</p></div>`;

  el('app').innerHTML = `<div class="library">
    <div class="lib-title">Bitácoras</div>
    ${tabs('momentos')}
    <div class="lib-sub">${M.moments.length} momento${M.moments.length === 1 ? '' : 's'} guardado${M.moments.length === 1 ? '' : 's'}</div>
    <button class="tb-btn primary big" onclick="newMoment()">✨ Nuevo momento</button>
    <div class="mom-list">${cuerpo}</div></div>`;

  for (const m of lista) for (const f of (m.photos || [])) {
    const box = el(`mt-${m.id}-${f}`);
    if (!box) continue;
    let src = momUrls[f] || await cacheGet(f, 'Momentos');
    if (!src) {
      try {
        const file = await (await momDir.getFileHandle(f)).getFile();
        const max = thumbSize(false);
        const thumb = await compressImage(file, max, max, thumbQuality());
        src = URL.createObjectURL(thumb);
        await cacheSet(f, thumb, 'Momentos');
      } catch (_) { continue; }
    }
    momUrls[f] = src;
    box.innerHTML = `<img src="${src}" alt="" loading="lazy" onclick="openMomentPhoto('${esc(f)}')">`;
  }
}

async function openMomentPhoto(file) {
  const img = el('lightbox-img');
  img.src = momUrls[file] || '';
  el('lightbox').classList.add('open');
  try {
    const full = URL.createObjectURL(await (await momDir.getFileHandle(file)).getFile());
    if (el('lightbox').classList.contains('open')) img.src = full;
  } catch (_) {}
}

function nowLocalISO() {
  const d = new Date(Date.now() - new Date().getTimezoneOffset() * 60000);
  return d.toISOString().slice(0, 16);
}

function newMoment() {
  momDraft = { id: 'm' + Date.now(), datetime: nowLocalISO(), text: '', people: [], photos: [] };
  renderMomentForm(true);
}

function editMoment(id) {
  const m = M.moments.find(x => x.id === id);
  if (!m) return;
  momDraft = JSON.parse(JSON.stringify(m));
  if (!Array.isArray(momDraft.people)) momDraft.people = [];
  if (!Array.isArray(momDraft.photos)) momDraft.photos = [];
  renderMomentForm(false);
}

function syncDraft() {
  if (!momDraft) return;
  const dt = el('mom-dt'), tx = el('mom-text');
  if (dt && dt.value) momDraft.datetime = dt.value;
  if (tx) momDraft.text = tx.value;
}

function addPersonFromList(name) {
  if (!name) return;
  syncDraft();
  if (!momDraft.people.includes(name)) momDraft.people.push(name);
  renderMomentForm(false);
}

function addNewPerson() {
  const inp = el('mom-new');
  const name = (inp.value || '').trim();
  if (!name) return;
  syncDraft();
  if (!M.people.some(p => p.toLowerCase() === name.toLowerCase())) {
    M.people.push(name);
    M.people.sort((a, b) => a.localeCompare(b, 'es'));
  }
  if (!momDraft.people.includes(name)) momDraft.people.push(name);
  renderMomentForm(false);
}

function removePerson(name) {
  syncDraft();
  momDraft.people = momDraft.people.filter(p => p !== name);
  renderMomentForm(false);
}

function renderDraftPhotos() {
  const grid = el('mom-fotos');
  if (!grid) return;
  grid.innerHTML = (momDraft.photos || []).map(f =>
    `<div class="photo-thumb">${momUrls[f] ? `<img src="${momUrls[f]}" alt="">` : '<div class="ph"></div>'}
      <button class="del-btn" onclick="removeDraftPhoto('${esc(f)}')">✕</button></div>`).join('')
    + `<button class="add-photo" onclick="addMomentPhotos()"><span style="font-size:1.4rem">＋</span>Añadir</button>`;
}

function addMomentPhotos() {
  const input = el('photo-input');
  input.value = '';
  input.onchange = async () => {
    if (!input.files.length) return;
    syncDraft();
    if (!await ensurePermission(momDir)) { status('Sin permiso de escritura', true); return; }
    status('Guardando fotos…');
    for (const file of input.files) {
      try {
        const blob = await compressImage(file, 1400, 1400, 0.78);
        const name = `momento_${momDraft.id}_${momDraft.photos.length}_${Date.now()}.jpg`;
        await writeFile(name, blob, momDir);
        const max = thumbSize(false);
        const thumb = await compressImage(blob, max, max, thumbQuality());
        momUrls[name] = URL.createObjectURL(thumb);
        await cacheSet(name, thumb, 'Momentos');
        momDraft.photos.push(name);
      } catch (e) { status('Una foto no se pudo guardar: ' + e.message, true); }
    }
    renderDraftPhotos();
    status('✓ Fotos añadidas');
  };
  input.click();
}

function removeDraftPhoto(file) {
  syncDraft();
  momDraft.photos = momDraft.photos.filter(f => f !== file);
  cacheDel(file, 'Momentos');
  if (momDir) momDir.removeEntry(file).catch(() => {});
  delete momUrls[file];
  renderDraftPhotos();
}

async function saveMoment() {
  syncDraft();
  if (!momDraft.datetime) { status('Falta la fecha', true); return; }
  if (!momDraft.text && !momDraft.photos.length) { status('Escribe algo o añade una foto', true); return; }
  const i = M.moments.findIndex(x => x.id === momDraft.id);
  if (i >= 0) M.moments[i] = momDraft; else M.moments.push(momDraft);
  const ok = await saveMoments();
  momDraft = null;
  await showMoments();
  if (ok) status('✓ Momento guardado');
}

async function deleteMoment(id) {
  const m = M.moments.find(x => x.id === id);
  if (!m) return;
  if (!confirm('¿Borrar este momento? También se borrarán sus fotos.')) return;
  for (const f of (m.photos || [])) {
    cacheDel(f, 'Momentos');
    try { await momDir.removeEntry(f); } catch (_) {}
    delete momUrls[f];
  }
  M.moments = M.moments.filter(x => x.id !== id);
  await saveMoments();
  await showMoments();
  status('Momento borrado');
}

/* ─── TEMA ─── */
function applyTheme(name) {
  const th = THEMES[name] || THEMES.crucero;
  document.body.className = 'theme-' + (THEMES[name] ? name : 'crucero');
  Object.entries(th.vars).forEach(([k, v]) => document.documentElement.style.setProperty(k, v));
  document.documentElement.style.setProperty('--display', th.display);
  return th;
}

/* ─── ABRIR UN VIAJE ─── */
async function openTrip(i) {
  try {
    const t = tripHandles[i];
    if (!t) { status('No encuentro ese viaje. Pulsa Actualizar.', true); return; }
    tripDir = t.handle;
    D = t.data;
    if (!D.visited) D.visited = [];
    ['journals', 'caught', 'photoFiles', 'statueFiles', 'moments'].forEach(k => { if (!D[k]) D[k] = {}; });
    dayDraft = null; cancelPick();

    if (!Array.isArray(D.days) || !D.days.length) { renderOldFormat(t); return; }

    urls = {}; fullUrls = {}; pending = [];
    el('btn-retry').style.display = 'none';
    renderTrip();
    if (window.scrollTo) window.scrollTo(0, 0);
    loadMedia().catch(e => { console.error(e); status('Las imágenes no se han podido cargar: ' + (e.message || e), true); });
  } catch (e) {
    console.error(e);
    status('No se pudo abrir el viaje: ' + (e.message || e), true);
  }
}

// Fusiona un bitacora.json con itinerario sobre un viaje antiguo, conservando reseñas, capturas y fotos
function importItinerary(i) {
  const input = el('json-input');
  input.value = '';
  input.onchange = async () => {
    const file = input.files[0];
    if (!file) return;
    try {
      const incoming = JSON.parse(await file.text());
      if (!Array.isArray(incoming.days) || !incoming.days.length) {
        status('Ese archivo tampoco trae la lista de días', true); return;
      }
      const t = tripHandles[i], mine = t.data;
      const merged = { ...incoming };
      ['visited', 'journals', 'caught', 'photoFiles', 'statueFiles'].forEach(k => {
        const a = mine[k], b = incoming[k];
        if (Array.isArray(a) ? a.length : a && Object.keys(a).length) merged[k] = a;
        else merged[k] = b || (Array.isArray(a) ? [] : {});
      });
      tripDir = t.handle;
      if (!await ensurePermission(tripDir)) { status('Sin permiso de escritura en la carpeta', true); return; }
      await writeFile('bitacora.json', new Blob([JSON.stringify(merged, null, 2)], { type: 'application/json' }));
      t.data = merged;
      status('✓ Itinerario añadido — tus reseñas y fotos siguen intactas');
      await openTrip(i);
    } catch (e) { status('No se pudo leer el archivo: ' + e.message, true); }
  };
  input.click();
}

/* ─── CACHÉ DE MINIATURAS ───
   Al abrir el HTML como archivo local, Chrome bloquea IndexedDB.
   Se detecta al arrancar y se cae a localStorage, que sí funciona en file://  */
let cacheMode = 'none';   // 'idb' | 'ls' | 'none'
let cacheFull = false;
const LS_PREFIX = 'bit:th:';

async function cacheInit() {
  try {
    await idbSet('thumbs', '__test__', 'ok');
    if (await idbGet('thumbs', '__test__') !== 'ok') throw new Error('idb ko');
    await idbDel('thumbs', '__test__');
    cacheMode = 'idb';
    return;
  } catch (_) {}
  try {
    localStorage.setItem('bit:test', '1');
    localStorage.removeItem('bit:test');
    cacheMode = 'ls';
  } catch (__) { cacheMode = 'none'; }
}

const blobToDataURL = blob => new Promise((res, rej) => {
  const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(blob);
});

// Tamaño de miniatura: en localStorage hay poco espacio, así que se aprieta más
const thumbSize = big => cacheMode === 'ls' ? (big ? 640 : 260) : (big ? 1200 : 420);
const thumbQuality = () => cacheMode === 'ls' ? 0.62 : 0.75;

async function cacheGet(name, dirName) {
  const key = thumbKey(name, dirName);
  try {
    if (cacheMode === 'idb') {
      const b = await idbGet('thumbs', key);
      return b ? URL.createObjectURL(b) : null;
    }
    if (cacheMode === 'ls') return localStorage.getItem(LS_PREFIX + key);
  } catch (_) {}
  return null;
}

async function cacheSet(name, blob, dirName) {
  const key = thumbKey(name, dirName);
  try {
    if (cacheMode === 'idb') { await idbSet('thumbs', key, blob); return; }
    if (cacheMode === 'ls') {
      if (cacheFull) return;
      localStorage.setItem(LS_PREFIX + key, await blobToDataURL(blob));
    }
  } catch (e) {
    if (cacheMode === 'ls') { cacheFull = true; console.warn('Caché llena:', e.message); }
  }
}

function cacheDel(name, dirName) {
  const key = thumbKey(name, dirName);
  try {
    if (cacheMode === 'idb') idbDel('thumbs', key);
    else if (cacheMode === 'ls') localStorage.removeItem(LS_PREFIX + key);
  } catch (_) {}
}

function cacheClear() {
  if (!confirm('¿Vaciar la caché de imágenes? La próxima apertura volverá a leerlas de la carpeta.')) return;
  try {
    if (cacheMode === 'ls') Object.keys(localStorage).filter(k => k.startsWith(LS_PREFIX)).forEach(k => localStorage.removeItem(k));
    else if (cacheMode === 'idb') db().then(d => d.transaction('thumbs', 'readwrite').objectStore('thumbs').clear());
    cacheFull = false;
    status('✓ Caché vaciada');
  } catch (e) { status('No se pudo vaciar: ' + e.message, true); }
}
const thumbKey = (name, dirName) => (dirName || (tripDir && tripDir.name) || 'root') + '|' + name;

async function loadMedia() {
  const dir = tripDir, data = D;
  const jobs = [];   // [nombre de archivo, clave, ¿imagen grande?]
  for (const [key, file] of Object.entries(data.photoFiles)) jobs.push([file, key, false]);
  for (const [key, file] of Object.entries(data.statueFiles)) jobs.push([file, 's-' + key, false]);
  for (const lista of Object.values(data.moments || {}))
    for (const m of lista) for (const f of (m.photos || [])) jobs.push([f, 'mom-' + f, false]);
  if (data.map?.staticImage) jobs.push([data.map.staticImage, 'mapimg', true]);
  if (data.trip?.coverImage) jobs.push([data.trip.coverImage, 'cover', true]);
  if (!jobs.length) return;

  // 1) Lo que ya está en caché: instantáneo
  const cached = await Promise.all(jobs.map(async ([name, key]) => {
    const src = await cacheGet(name);
    if (src) { urls[key] = src; return true; }
    return false;
  }));
  if (D !== data) return;
  const hits = cached.filter(Boolean).length;
  if (hits) renderTrip();
  const missing = jobs.filter((_, i) => !cached[i]);
  if (!missing.length) { status('✓ Viaje abierto'); return; }

  // 2) Lo que falta: se lee del disco una sola vez y queda cacheado.
  //    De dos en dos como mucho: los proveedores de archivos en la nube
  //    (Drive en Android) sirven de uno en uno y con más peticiones caducan.
  status(`Preparando ${missing.length} imágenes (solo esta vez)…`);
  let done = 0;

  pending = [];
  for (let i = 0; i < missing.length; i += 2) {
    if (D !== data) return;
    const lote = missing.slice(i, i + 2);
    const res = await Promise.all(lote.map(readPending));
    res.forEach((ok, k) => { if (!ok) pending.push(lote[k]); });
    done += lote.length;
    status(`Preparando imágenes… ${done}/${missing.length}`);
    if (done % 10 === 0) refreshImages();               // se van viendo sin esperar al final
  }
  if (D !== data) return;
  const failed = pending.length;
  renderTrip();
  el('btn-retry').style.display = failed ? '' : 'none';
  if (failed) status(`✓ Listo · faltan ${failed} imagen(es) — pulsa ↻ para reintentarlas`, true);
  else if (cacheMode === 'none') status('✓ Listo · este navegador no deja guardar caché aquí', true);
  else if (cacheFull) status('✓ Listo · caché llena: algunas se releerán cada vez', true);
  else status('✓ Listo — la próxima vez abrirá al instante');
}

const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('tiempo agotado')), ms))]);

// Lee un archivo de la carpeta y guarda su miniatura. Hasta 3 intentos, con más margen cada vez.
async function readPending([name, key, big]) {
  for (let intento = 1; intento <= 3; intento++) {
    try {
      const ms = 20000 * intento;
      const fh = await withTimeout(tripDir.getFileHandle(name), ms);
      const file = await withTimeout(fh.getFile(), ms);
      const max = thumbSize(big);
      const thumb = await compressImage(file, max, max, thumbQuality());
      urls[key] = URL.createObjectURL(thumb);
      await cacheSet(name, thumb);
      return true;
    } catch (_) {
      if (intento < 3) await new Promise(r => setTimeout(r, 400 * intento));
    }
  }
  return false;
}

// Repinta solo las miniaturas ya disponibles, sin reconstruir la página entera
function refreshImages() {
  (D.days || []).forEach((d, i) => {
    renderPhotos(i);
    renderDayMoments(i);
    (d.hunt?.items || []).forEach((_, j) => renderStatue(i, j));
  });
}

// Reintenta las imágenes que se quedaron sin cargar
async function retryPending() {
  if (!pending.length) { status('No queda ninguna pendiente'); return; }
  const data = D, lista = pending.slice();
  status(`Reintentando ${lista.length} imágenes…`);
  pending = [];
  for (const job of lista) {
    if (D !== data) return;
    const ok = await readPending(job);
    if (!ok) pending.push(job);
  }
  refreshImages();
  el('btn-retry').style.display = pending.length ? '' : 'none';
  status(pending.length ? `Siguen faltando ${pending.length}. ¿Están en la carpeta del viaje?` : '✓ Ya están todas', !!pending.length);
}

/* La foto a tamaño completo solo se lee del disco al ampliarla */
function fileNameFor(key) {
  if (key === 'mapimg') return D.map?.staticImage;
  if (key.startsWith('mom-')) return key.slice(4);   // la clave de un momento lleva dentro el nombre del archivo
  if (key.startsWith('s-')) return D.statueFiles[key.slice(2)];
  return D.photoFiles[key];
}
async function loadFull(key) {
  if (fullUrls[key]) return fullUrls[key];
  const name = fileNameFor(key);
  if (!name) return null;
  const fh = await tripDir.getFileHandle(name);
  fullUrls[key] = URL.createObjectURL(await fh.getFile());
  return fullUrls[key];
}

/* ─── RENDER DEL VIAJE ─── */
function W(key, fallback) { return (D.trip?.wording || {})[key] || fallback; }

function renderTrip() {
  const tr = D.trip || {}, th = applyTheme(tr.theme);
  el('btn-pdf').style.display = el('btn-zip').style.display = el('btn-library').style.display = '';
  el('score-bar').style.display = '';
  document.title = 'Bitácora · ' + (tr.title || '');

  const crew = (tr.crew || []).join(' · ');
  let h = `<header>
    ${HERO_ART[th.art] || HERO_ART.ship}
    <div class="header-title">${th.icon} ${esc(tr.title || '')} ${th.icon}</div>
    <div class="header-sub">${esc(tr.subtitle || '')}</div>
    ${crew ? `<div class="header-crew">${esc(W('crewLabel', 'Viajeros'))}: ${esc(crew)}</div>` : ''}
    <svg class="header-wave" viewBox="0 0 1200 50" preserveAspectRatio="none"><path d="M0 20 Q150 0 300 20 Q450 40 600 20 Q750 0 900 20 Q1050 40 1200 20 L1200 50 L0 50Z" fill="var(--paper)"/></svg>
  </header><main>`;

  if (urls.mapimg) h += `<div class="panel"><div class="panel-label">🗺️ El mapa de la aventura</div><img class="map-img" src="${urls.mapimg}" alt="Mapa"></div>`;

  const hasCoords = (D.days || []).some(d => d.map);
  if (hasCoords) h += `<div class="panel"><div class="panel-label">🧭 Mapa interactivo</div><div id="leaflet-map"></div>
    <div class="map-hint">Toca un marcador para ver la parada. Acerca el mapa para ver la ruta a pie de cada día.
      Los ✨ son los momentos y sitios que añadiste tú.</div></div>`;

  if (D.vehicle) {
    const v = D.vehicle;
    h += `<div class="section-heading">${v.icon || th.icon} ${esc(W('vehicleTitle', v.name || 'Datos del viaje'))}</div><div class="panel">
      <div class="stat-grid">${(v.stats || []).map(s => `<div class="stat"><div class="stat-icon">${s.icon || ''}</div>
        <div class="stat-value">${esc(s.value)}</div><div class="stat-label">${esc(s.label)}</div>
        ${s.note ? `<div class="stat-note">${esc(s.note)}</div>` : ''}</div>`).join('')}</div>
      ${(v.curiosities || []).length ? `<div style="margin-top:.9rem">${v.curiosities.map(c =>
        `<div class="curio"><span class="curio-icon">${c.icon || '•'}</span><div>${c.title ? `<strong>${esc(c.title)}:</strong> ` : ''}${esc(c.text)}</div></div>`).join('')}</div>` : ''}
    </div>`;
  }

  const days = D.days || [];
  h += `<div class="progress-label"><span>${th.icon} ${esc(W('progressLabel', 'Paradas visitadas'))}</span><span id="prog-txt"></span></div>
    <div class="progress-wrap"><div class="progress-bar" id="prog-bar"></div></div>
    <div class="section-heading">📜 ${esc(W('diaryTitle', 'El diario del viaje'))}</div>`;

  days.forEach((d, i) => { h += dayCard(d, i); });
  h += scoreboard() + `</main>`;
  el('app').innerHTML = h;

  days.forEach((d, i) => { renderPhotos(i); renderDayMoments(i); (d.hunt?.items || []).forEach((_, j) => renderStatue(i, j)); updateHuntBadge(i); });
  updateProgress(); updateScore();
  if (hasCoords) initMap();
}

          ${d.note ? `<div class="day-note">${esc(d.note)}</div>` : ''}

    ${(hist.paragraphs?.length || d.route) ? `
    <button class="toggle" onclick="toggleBox('det-${i}',this)"><span class="arr">▶</span> 📜 Historia y ruta del día</button>
    <div class="collapse" id="det-${i}">

      ${hist.challenge ? `<div class="challenge">🎯 ${esc(hist.challenge)}</div>` : ''}
      ${d.route ? `<div class="route-block">

        ${d.route.alert ? `<div class="route-alert">⏰ ${esc(d.route.alert)}</div>` : ''}
        <ul class="route-steps">${(d.route.steps || []).map((s, si) => `<li class="route-step">
          <div class="step-dot ${s.transit ? 'transit' : ''}">${s.icon || (si + 1)}</div>

          ${s.desc ? `<div class="step-desc">${esc(s.desc)}</div>` : ''}</div></li>`).join('')}</ul>
      </div>` : ''}
    </div>` : ''}

    ${items.length ? `
    <button class="toggle" onclick="toggleBox('hunt-${i}',this)"><span class="arr">▶</span> 🗿 ${esc(W('huntTitle', 'Caza de tesoros'))} — ${esc(d.place || '')}
      <span class="hunt-badge" id="hb-${i}">0/${items.length}</span></button>
    <div class="collapse" id="hunt-${i}">
      ${hunt.intro ? `<div class="hunt-intro">${esc(hunt.intro)}</div>` : ''}
      <div class="statue-grid">${items.map((it, j) => `<div class="statue-card" id="s-${i}-${j}">
        <span class="statue-emoji">${it.emoji || '🗿'}</span>
        <div class="statue-name">${esc(it.name)}</div>
        <div class="statue-clue">${esc(it.clue || '')}</div>
        <div class="statue-pts">⭐ ${it.pts || 0} pts</div>
        <button class="statue-btn" id="sb-${i}-${j}" onclick="captureStatue(${i},${j})">📸 Foto para capturar</button>

    </div>` : ''}

    <div class="journal">
      <div class="journal-label">✍️ ¿Qué vivimos hoy?</div>
      <textarea id="jt-${i}" placeholder="${esc(d.journalPlaceholder || 'Escribe aquí lo mejor del día…')}">${esc(D.journals[i] || '')}</textarea>
      <div class="save-row"><button class="save-btn" onclick="saveJournal(${i})">Guardar reseña</button>

      <div class="photo-grid" id="pg-${i}"></div>

function scoreboard() {
  const days = D.days || [];
  let rows = '', tc = 0, tp = 0, tm = 0, tt = 0;
  days.forEach((d, i) => {
    const items = d.hunt?.items || [];
    if (!items.length) return;
    let c = 0, p = 0, m = 0;
    items.forEach((it, j) => { m += it.pts || 0; if (D.caught[i + '-' + j]) { c++; p += it.pts || 0; } });
    tc += c; tp += p; tm += m; tt += items.length;
    rows += `<tr><td>${d.emoji || ''} ${esc(d.place)}</td><td>${c}/${items.length}</td><td>${p}</td><td>${m}</td></tr>`;
  });
  if (!rows) return '';
  const ranks = (D.trip?.ranks || []).slice().sort((a, b) => a.min - b.min);
  let rank = ranks[0];
  ranks.forEach(r => { if (tp >= r.min) rank = r; });
  return `<div class="section-heading">🏆 Marcador de la expedición</div><div class="panel">
    <table class="score-table"><tr><th>${esc(W('stopSingular', 'Parada'))}</th><th>${esc(W('huntUnit', 'Capturas'))}</th><th>Puntos</th><th>Máx.</th></tr>
      ${rows}<tr><td>TOTAL</td><td>${tc}/${tt}</td><td>${tp}</td><td>${tm}</td></tr></table>
    ${rank ? `<div class="rank-box"><div style="font-size:.7rem;letter-spacing:.1em;text-transform:uppercase">Rango actual</div>
      <div class="rank-name">${rank.icon || ''} ${esc(rank.name)}</div></div>` : ''}</div>`;
}

/* ─── INTERACCIÓN ─── */
function toggleBox(id, btn) { el(id).classList.toggle('open'); btn.classList.toggle('open'); }

function toggleVisit(i) {
  D.visited[i] = !D.visited[i];
  el('dc-' + i).classList.toggle('visited', !!D.visited[i]);

function updateProgress() {
  const n = (D.visited || []).filter(Boolean).length, total = (D.days || []).length;
  el('prog-bar').style.width = (total ? n / total * 100 : 0) + '%';
  el('prog-txt').textContent = `${n} de ${total} ${W('stopPlural', 'paradas')}`;

function updateHuntBadge(i) {
  const items = D.days[i].hunt?.items || [];
  if (!items.length) return;
  const c = items.filter((_, j) => D.caught[i + '-' + j]).length;
  const b = el('hb-' + i), s = el('hs-' + i);
  if (b) b.textContent = c + '/' + items.length;
  if (s) s.textContent = c;

function updateScore() {
  let c = 0, p = 0, t = 0, m = 0;
  (D.days || []).forEach((d, i) => (d.hunt?.items || []).forEach((it, j) => {
    t++; m += it.pts || 0;
    if (D.caught[i + '-' + j]) { c++; p += it.pts || 0; }
  }));
  el('score-bar').innerHTML = t
    ? `🏆 ${esc(W('huntUnit', 'Capturas'))}: <span class="sc">${c}</span> / <span class="sc">${t}</span> &nbsp;·&nbsp; Puntos: <span class="sc">${p}</span> ⭐`
    : `📓 ${esc(D.trip?.title || '')}`;
}

/* ─── FOTOS ─── */
function compressImage(file, maxW, maxH, quality) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let { width: w, height: hh } = img;
        const r = Math.min(maxW / w, maxH / hh, 1);
        w = Math.round(w * r); hh = Math.round(hh * r);
        const cv = document.createElement('canvas'); cv.width = w; cv.height = hh;
        cv.getContext('2d').drawImage(img, 0, 0, w, hh);
        cv.toBlob(b => b ? resolve(b) : reject(new Error('No se pudo procesar la imagen')), 'image/jpeg', quality);
      };
      img.onerror = () => reject(new Error('Imagen no válida'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('No se pudo leer el archivo'));
    reader.readAsDataURL(file);
  });
}

async function writeFile(name, blob, dir) {
  const fh = await (dir || tripDir).getFileHandle(name, { create: true });
  const wr = await fh.createWritable();
  await wr.write(blob); await wr.close();
}

function addPhotos(i) {
  const input = el('photo-input');
  input.value = '';
  input.onchange = async () => {
    if (!input.files.length) return;
    if (!await ensurePermission(tripDir)) { status('Sin permiso de escritura en la carpeta', true); return; }
    status('Guardando fotos…');
    for (const file of input.files) {
      try {
        const blob = await compressImage(file, 1400, 1400, 0.78);
        const n = Object.keys(D.photoFiles).filter(k => k.startsWith(`day-${i}-`)).length;
        const key = `day-${i}-${n}`;
        const name = `foto_dia${i + 1}_${Date.now()}_${n}.jpg`;
        await writeFile(name, blob);
        D.photoFiles[key] = name;
        const m = thumbSize(false);
        const thumb = await compressImage(blob, m, m, thumbQuality());
        urls[key] = URL.createObjectURL(thumb);
        await cacheSet(name, thumb);
      } catch (e) { status('Una foto no se pudo guardar: ' + e.message, true); }
    }
    await save(); renderPhotos(i); status('✓ Fotos guardadas');
  };
  input.click();
}

function renderPhotos(i) {
  const grid = el('pg-' + i);
  if (!grid) return;
  const idx = k => parseInt(k.split('-')[2], 10) || 0;
  const keys = Object.keys(D.photoFiles).filter(k => k.startsWith(`day-${i}-`)).sort((a, b) => idx(a) - idx(b));
  grid.innerHTML = keys.filter(k => urls[k]).map(k =>
    `<div class="photo-thumb"><img src="${urls[k]}" alt="" loading="lazy" onclick="openLightbox('${k}')">
      <button class="del-btn" onclick="deletePhoto('${k}',${i})" title="Quitar foto">✕</button></div>`).join('')
    + `<button class="add-photo" onclick="addPhotos(${i})"><span style="font-size:1.4rem">＋</span>Añadir</button>`;
}

async function deletePhoto(key, i) {
  if (!confirm('¿Quitar esta foto de la bitácora? El archivo original se borra de la carpeta.')) return;
  const name = D.photoFiles[key];
  if (name) cacheDel(name);
  delete D.photoFiles[key]; delete urls[key]; delete fullUrls[key];
  try { if (name) await tripDir.removeEntry(name); } catch (_) {}
  await save(); renderPhotos(i);
}

function captureStatue(i, j) {
  const input = el('statue-input');
  input.value = '';
  input.onchange = async () => {
    const file = input.files[0];
    if (!file) return;
    if (!await ensurePermission(tripDir)) { status('Sin permiso de escritura en la carpeta', true); return; }
    try {
      const blob = await compressImage(file, 900, 900, 0.72);
      const key = i + '-' + j;
      const name = `captura_${key}_${Date.now()}.jpg`;
      await writeFile(name, blob);
      D.statueFiles[key] = name;
      D.caught[key] = true;
      const m = thumbSize(false);
      const thumb = await compressImage(blob, m, m, thumbQuality());
      urls['s-' + key] = URL.createObjectURL(thumb);
      await cacheSet(name, thumb);
      await save();
      renderStatue(i, j); updateHuntBadge(i); updateScore();
      const pts = D.days[i].hunt.items[j].pts || 0;
      status(`✓ ¡Capturada! +${pts} puntos`);
    } catch (e) { status('No se pudo guardar la captura: ' + e.message, true); }
  };
  input.click();
}

function renderStatue(i, j) {
  const key = i + '-' + j, card = el('s-' + i + '-' + j);
  if (!card) return;
  const caught = !!D.caught[key], url = urls['s-' + key];
  card.classList.toggle('caught', caught);
  el('sb-' + i + '-' + j).textContent = caught ? '✓ Capturada' : '📸 Foto para capturar';
  const items = D.days[i].hunt?.items || [];
  el('sp-' + i + '-' + j).innerHTML = url
    ? `<img src="${url}" alt="" loading="lazy" onclick="openLightbox('s-${key}')">
       <button class="del-btn" onclick="deleteStatue(${i},${j})" title="Quitar captura">✕</button>
       <select class="move-sel" onchange="moveCapture(${i},${j},this.value);this.selectedIndex=0">
         <option value="">↔ Mover a otro objetivo…</option>
         ${items.map((it, k) => k === j ? '' : `<option value="${k}">${esc(it.name)}</option>`).join('')}
       </select>` : '';
}

// Intercambia la foto (y la marca de capturada) entre dos objetivos del mismo día
async function moveCapture(i, from, to) {
  if (to === '' || to == null) return;
  to = +to;
  const a = i + '-' + from, b = i + '-' + to;
  const fileA = D.statueFiles[a], fileB = D.statueFiles[b];
  const caughtA = !!D.caught[a], caughtB = !!D.caught[b];
  const urlA = urls['s-' + a], urlB = urls['s-' + b];

  const set = (key, file, wasCaught, url) => {
    if (file) { D.statueFiles[key] = file; } else { delete D.statueFiles[key]; }
    if (wasCaught) { D.caught[key] = true; } else { delete D.caught[key]; }
    if (url) { urls['s-' + key] = url; } else { delete urls['s-' + key]; }
    delete fullUrls['s-' + key];
  };
  set(b, fileA, caughtA, urlA);
  set(a, fileB, caughtB, urlB);

  await save();
  renderStatue(i, from); renderStatue(i, to); updateHuntBadge(i); updateScore();
  status(fileB ? '✓ Capturas intercambiadas' : '✓ Captura movida');
}

async function deleteStatue(i, j) {
  if (!confirm('¿Quitar esta captura?')) return;
  const key = i + '-' + j, name = D.statueFiles[key];
  if (name) cacheDel(name);
  delete D.statueFiles[key]; delete D.caught[key]; delete urls['s-' + key]; delete fullUrls['s-' + key];
  try { if (name) await tripDir.removeEntry(name); } catch (_) {}
  await save(); renderStatue(i, j); updateHuntBadge(i); updateScore();
}

/* ─── MOMENTOS Y HALLAZGOS DEL DÍA ───
   Lo que de verdad pasó, al margen de la ruta preparada: un sitio que no estaba
   en el plan, una merienda, un rato que merece recordarse. Nunca toca `route`. */
let dayDraft = null;      // momento que se está escribiendo
let mapPickDay = null;    // día que espera un toque en el mapa

const dayMoments = i => (D.moments && D.moments[i]) || [];
const momKey = f => 'mom-' + f;

function renderDayMoments(i) {
  const box = el('dm-' + i);
  if (!box) return;
  if (dayDraft && dayDraft.day === i) { box.innerHTML = dayMomentForm(); renderDayDraftPhotos(); return; }

  const lista = dayMoments(i).slice().sort((a, b) => (a.datetime || '').localeCompare(b.datetime || ''));
  box.innerHTML = lista.map(m => {
    const fotos = (m.photos || []).filter(f => urls[momKey(f)]).map(f =>
      `<div class="photo-thumb"><img src="${urls[momKey(f)]}" alt="" loading="lazy" onclick="openLightbox('${esc(momKey(f))}')"></div>`).join('');
    return `<div class="dm-item">
      <div class="dm-when">${esc(fmtDate(m.datetime))}</div>
      ${m.place ? `<div class="dm-place">📍 ${esc(m.place)}</div>` : ''}
      ${m.text ? `<div class="dm-text">${esc(m.text)}</div>` : ''}
      ${m.lat != null ? `<div class="dm-coord">🗺️ ${m.lat.toFixed(4)}, ${m.lng.toFixed(4)}</div>` : ''}
      ${fotos ? `<div class="photo-grid">${fotos}</div>` : ''}
      <div class="dm-acts">
        <button onclick="editDayMoment(${i},'${esc(m.id)}')">✎ Editar</button>
        <button onclick="deleteDayMoment(${i},'${esc(m.id)}')">🗑 Borrar</button>
      </div></div>`;
  }).join('') + `<button class="dm-add" onclick="newDayMoment(${i})">＋ Añadir un momento o un sitio</button>`;
}

function dayMomentForm() {
  const d = dayDraft;
  const hayMapa = (D.days || []).some(x => x.map);
  return `<div class="dm-form">
    <label class="fld">Cuándo
      <input type="datetime-local" id="dm-dt" value="${esc(d.datetime)}"></label>
    <label class="fld">Sitio
      <input type="text" id="dm-place" value="${esc(d.place || '')}" placeholder="La heladería de la plaza (opcional)"></label>
    <label class="fld">¿Qué pasó?
      <textarea id="dm-text" placeholder="Lo que no estaba en el plan…">${esc(d.text || '')}</textarea></label>
    <div class="fld">Dónde
      <div class="dm-loc">${d.lat != null
        ? `🗺️ ${d.lat.toFixed(5)}, ${d.lng.toFixed(5)} <button class="tb-btn" onclick="clearDayLoc()">Quitar</button>`
        : '<span class="muted">Sin marcar en el mapa</span>'}</div>
      <div class="row">
        <button class="tb-btn" onclick="locateHere()">📍 Estoy aquí</button>
        ${hayMapa ? `<button class="tb-btn" onclick="pickOnMap()">🗺️ Marcar en el mapa</button>` : ''}
      </div></div>
    <div class="fld">Fotos
      <div class="photo-grid" id="dm-fotos"></div></div>
    <div class="row end">
      <button class="tb-btn" onclick="cancelDayMoment()">Cancelar</button>
      <button class="tb-btn primary" onclick="saveDayMoment()">Guardar momento</button>
    </div></div>`;
}

function syncDayDraft() {
  if (!dayDraft) return;
  const dt = el('dm-dt'), tx = el('dm-text'), pl = el('dm-place');
  if (dt && dt.value) dayDraft.datetime = dt.value;
  if (tx) dayDraft.text = tx.value;
  if (pl) dayDraft.place = pl.value;
}

function newDayMoment(i) {
  if (dayDraft) cancelDayMoment();
  dayDraft = { day: i, id: 'mo' + Date.now(), datetime: nowLocalISO(), text: '', place: '', photos: [] };
  renderDayMoments(i);
}

function editDayMoment(i, id) {
  const m = dayMoments(i).find(x => x.id === id);
  if (!m) return;
  dayDraft = JSON.parse(JSON.stringify(m));
  dayDraft.day = i;
  if (!Array.isArray(dayDraft.photos)) dayDraft.photos = [];
  renderDayMoments(i);
}

async function cancelDayMoment() {
  const d = dayDraft;
  if (!d) return;
  // Las fotos se escriben al elegirlas; si se cancela hay que deshacer las que no estaban guardadas
  const guardadas = (dayMoments(d.day).find(x => x.id === d.id) || {}).photos || [];
  for (const f of d.photos.filter(f => !guardadas.includes(f))) await dropMomentPhoto(f);
  const i = d.day;
  dayDraft = null; cancelPick();
  renderDayMoments(i);
}

function clearDayLoc() {
  syncDayDraft();
  delete dayDraft.lat; delete dayDraft.lng;
  renderDayMoments(dayDraft.day);
}

function locateHere() {
  syncDayDraft();
  if (!navigator.geolocation) { status('Este navegador no sabe decir dónde estás', true); return; }
  status('Buscando dónde estás…');
  navigator.geolocation.getCurrentPosition(pos => {
    if (!dayDraft) return;
    dayDraft.lat = +pos.coords.latitude.toFixed(6);
    dayDraft.lng = +pos.coords.longitude.toFixed(6);
    renderDayMoments(dayDraft.day);
    status('✓ Ubicación tomada');
  }, err => {
    const causa = err.code === err.PERMISSION_DENIED ? 'no has dado permiso de ubicación'
      : err.code === err.TIMEOUT ? 'ha tardado demasiado, prueba al aire libre'
      : 'no hay señal suficiente';
    status('No se pudo tomar la ubicación: ' + causa + '. Puedes marcarla en el mapa.', true);
  }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 30000 });
}

function pickOnMap() {
  syncDayDraft();
  const box = el('leaflet-map');
  if (!mapObj || !box) { status('El mapa no está disponible en este viaje', true); return; }
  mapPickDay = dayDraft.day;
  box.classList.add('picking');
  status('Toca en el mapa el sitio exacto');
  box.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function cancelPick() {
  mapPickDay = null;
  const box = el('leaflet-map');
  if (box) box.classList.remove('picking');
}

function mapPicked(e) {
  if (mapPickDay == null || !dayDraft) return;
  dayDraft.lat = +e.latlng.lat.toFixed(6);
  dayDraft.lng = +e.latlng.lng.toFixed(6);
  const i = mapPickDay;
  cancelPick();
  if (mapObj) mapObj.closePopup();
  renderDayMoments(i);
  goToDay(i);
  status('✓ Sitio marcado');
}

// Leaflet no pasa al mapa el toque que cae sobre un marcador. Sin esto, marcar
// encima de una parada o de un paso de la ruta no haría nada.
function pickable(marker) {
  marker.on('click', e => { if (mapPickDay != null) mapPicked(e); });
  return marker;
}

function goToDay(i) {
  const card = el('dc-' + i);
  if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function addDayMomentPhotos() {
  const input = el('photo-input');
  input.value = '';
  input.onchange = async () => {
    if (!input.files.length || !dayDraft) return;
    syncDayDraft();
    if (!await ensurePermission(tripDir)) { status('Sin permiso de escritura en la carpeta', true); return; }
    status('Guardando fotos…');
    for (const file of input.files) {
      try {
        const blob = await compressImage(file, 1400, 1400, 0.78);
        const name = `momento_dia${dayDraft.day + 1}_${dayDraft.id}_${dayDraft.photos.length}.jpg`;
        await writeFile(name, blob);
        const max = thumbSize(false);
        const thumb = await compressImage(blob, max, max, thumbQuality());
        urls[momKey(name)] = URL.createObjectURL(thumb);
        await cacheSet(name, thumb);
        dayDraft.photos.push(name);
      } catch (e) { status('Una foto no se pudo guardar: ' + e.message, true); }
    }
    renderDayDraftPhotos();
    status('✓ Fotos añadidas');
  };
  input.click();
}

function renderDayDraftPhotos() {
  const grid = el('dm-fotos');
  if (!grid || !dayDraft) return;
  grid.innerHTML = dayDraft.photos.map(f =>
    `<div class="photo-thumb">${urls[momKey(f)] ? `<img src="${urls[momKey(f)]}" alt="">` : '<div class="ph"></div>'}
      <button class="del-btn" onclick="removeDayDraftPhoto('${esc(f)}')">✕</button></div>`).join('')
    + `<button class="add-photo" onclick="addDayMomentPhotos()"><span style="font-size:1.4rem">＋</span>Añadir</button>`;
}

async function removeDayDraftPhoto(file) {
  syncDayDraft();
  dayDraft.photos = dayDraft.photos.filter(f => f !== file);
  await dropMomentPhoto(file);
  renderDayDraftPhotos();
}

async function dropMomentPhoto(file) {
  cacheDel(file);
  delete urls[momKey(file)]; delete fullUrls[momKey(file)];
  try { await tripDir.removeEntry(file); } catch (_) {}
}

async function saveDayMoment() {
  syncDayDraft();
  const d = dayDraft;
  if (!d.text && !d.place && !d.photos.length && d.lat == null) {
    status('Escribe algo, marca un sitio o añade una foto', true); return;
  }
  const guardado = { id: d.id, datetime: d.datetime, place: d.place || '', text: d.text || '', photos: d.photos };
  if (d.lat != null) { guardado.lat = d.lat; guardado.lng = d.lng; }

  const i = d.day, lista = dayMoments(i).slice();
  const k = lista.findIndex(x => x.id === d.id);
  if (k >= 0) lista[k] = guardado; else lista.push(guardado);
  D.moments[i] = lista;

  dayDraft = null; cancelPick();
  await save();
  renderDayMoments(i);
  refreshMomentMarkers();
  status('✓ Momento guardado');
}

async function deleteDayMoment(i, id) {
  const m = dayMoments(i).find(x => x.id === id);
  if (!m) return;
  if (!confirm('¿Borrar este momento? También se borran sus fotos de la carpeta.')) return;
  for (const f of (m.photos || [])) await dropMomentPhoto(f);
  D.moments[i] = dayMoments(i).filter(x => x.id !== id);
  if (!D.moments[i].length) delete D.moments[i];
  await save();
  renderDayMoments(i);
  refreshMomentMarkers();
  status('Momento borrado');
}

  el('lightbox').classList.add('open');

/* ─── GUARDADO ─── */
async function save() {
  if (!tripDir) return;
  clearTimeout(saveTimer);
  return new Promise(res => {
    saveTimer = setTimeout(async () => {
      try {
        if (!await ensurePermission(tripDir)) { status('Sin permiso para guardar', true); return res(); }
        const blob = new Blob([JSON.stringify(D, null, 2)], { type: 'application/json' });
        await writeFile('bitacora.json', blob);
      } catch (e) { status('No se pudo guardar: ' + e.message, true); }
      res();
    }, 250);
  });
}

/* ─── MAPA ─── */
let mapObj = null, mapTries = 0, momentLayer = null;
function initMap() {
  const box = el('leaflet-map');
  if (!box) return;
  if (typeof L === 'undefined') {
    if (++mapTries < 24) { setTimeout(initMap, 250); return; }
    box.outerHTML = `<div class="map-hint" style="padding:1rem">El mapa interactivo necesita conexión la primera vez.
      Ábrela una vez con internet y quedará guardada para usarla sin conexión.</div>`;
    return;
  }
  mapTries = 0;
  if (mapObj) { try { mapObj.remove(); } catch (_) {} mapObj = null; }
  const cfg = D.map || {}, days = D.days || [];
  const stops = days.map((d, i) => ({ d, i })).filter(x => x.d.map);
  mapObj = L.map('leaflet-map', { center: cfg.center || [stops[0].d.map.lat, stops[0].d.map.lng], zoom: cfg.zoom || 6 });
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18, attribution: '© OpenStreetMap' }).addTo(mapObj);

  const line = stops.map(x => [x.d.map.lat, x.d.map.lng]);
  if (cfg.closeLoop && line.length > 1) line.push(line[0]);
  L.polyline(line, { color: cfg.routeColor || '#c0392b', weight: 2.5, dashArray: '8,6', opacity: .85 }).addTo(mapObj);

  const accent = getComputedStyle(document.documentElement).getPropertyValue('--panel').trim();
  stops.forEach((x, k) => {
    const m = x.d.map, color = m.color || accent;
    pickable(L.marker([m.lat, m.lng], { icon: L.divIcon({ className: '', iconSize: [30, 30], iconAnchor: [15, 15],
      html: `<div style="background:${color};width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:13px">${k + 1}</div>` }) })
      .bindPopup(`<div style="font-family:Lato,sans-serif;text-align:center;min-width:140px">
        ${m.image ? `<img src="${m.image}" style="width:100%;height:84px;object-fit:cover;border-radius:6px;margin-bottom:5px" onerror="this.remove()">` : ''}
        <div style="font-weight:900">${esc(m.label || x.d.place)}</div>
        <div style="font-size:.78rem;color:#777">${esc(m.when || x.d.date || '')}</div></div>`, { maxWidth: 220 }))
      .addTo(mapObj);
  });

  // rutas a pie: aparecen al acercar
  const layers = [];
  stops.forEach(x => {
    const r = x.d.route;
    if (!r || !r.line) return;
    const color = r.color || '#8e44ad';
    const pl = L.polyline(r.line, { color, weight: 3, opacity: .9 });
    const marks = (r.steps || []).filter(s => s.lat).map((s, si) => pickable(L.marker([s.lat, s.lng], {
      icon: L.divIcon({ className: '', iconSize: [20, 20], iconAnchor: [10, 10],
        html: `<div style="background:${color};width:20px;height:20px;border-radius:50%;border:2px solid #fff;display:flex;align-items:center;justify-content:center;color:#fff;font-size:9px;font-weight:900">${si + 1}</div>` })
    }).bindPopup(`<b>${esc(s.time || '')}</b><br>${esc(s.short || s.place || '')}`, { maxWidth: 180 })));
    layers.push({ zoom: r.zoom || 12, pl, marks });
  });
  const refresh = () => {
    const z = mapObj.getZoom();
    layers.forEach(l => {
      const show = z >= (l.zoom - 1);
      if (show) { if (!mapObj.hasLayer(l.pl)) l.pl.addTo(mapObj); l.marks.forEach(m => !mapObj.hasLayer(m) && m.addTo(mapObj)); }
      else { if (mapObj.hasLayer(l.pl)) mapObj.removeLayer(l.pl); l.marks.forEach(m => mapObj.hasLayer(m) && mapObj.removeLayer(m)); }
    });
  };
  mapObj.on('zoomend', refresh); refresh();

  momentLayer = L.layerGroup().addTo(mapObj);
  refreshMomentMarkers();
  mapObj.on('click', mapPicked);

  setTimeout(() => mapObj.invalidateSize(), 300);
}

// Los momentos con ubicación van en su propia capa, siempre visible y con otro color:
// se distinguen de un vistazo de las paradas del itinerario y de las rutas a pie.
function refreshMomentMarkers() {
  if (!mapObj || !momentLayer) return;
  momentLayer.clearLayers();
  if (typeof L === 'undefined') return;
  const color = getComputedStyle(document.documentElement).getPropertyValue('--alt').trim() || '#1a6b9a';
  Object.entries(D.moments || {}).forEach(([día, lista]) => {
    const i = +día;
    lista.filter(m => m.lat != null).forEach(m => {
      const foto = (m.photos || []).find(f => urls[momKey(f)]);
      pickable(L.marker([m.lat, m.lng], { icon: L.divIcon({ className: '', iconSize: [26, 26], iconAnchor: [13, 13],
        html: `<div style="background:${color};width:26px;height:26px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;font-size:13px">✨</div>` }) })
        .bindPopup(`<div style="font-family:Lato,sans-serif;min-width:150px">
          ${foto ? `<img src="${urls[momKey(foto)]}" style="width:100%;height:84px;object-fit:cover;border-radius:6px;margin-bottom:5px">` : ''}
          ${m.place ? `<div style="font-weight:900">${esc(m.place)}</div>` : ''}
          <div style="font-size:.74rem;color:#777">${esc(fmtDate(m.datetime))}</div>
          ${m.text ? `<div style="font-size:.82rem;margin-top:3px">${esc(m.text.slice(0, 140))}${m.text.length > 140 ? '…' : ''}</div>` : ''}
          <button onclick="goToDay(${i})" style="margin-top:6px;font-size:.75rem">Ver en el diario</button>
        </div>`, { maxWidth: 230 }))
        .addTo(momentLayer);
    });
  });
}

/* ─── COPIA DE SEGURIDAD (ZIP) ─── */
async function exportZip() {
  if (typeof JSZip === 'undefined') { status('La copia ZIP necesita conexión la primera vez para cargar su librería', true); return; }
  try {
    status('Preparando copia…');
    const zip = new JSZip();
    zip.file('bitacora.json', JSON.stringify(D, null, 2));
    const all = { ...D.photoFiles };
    Object.entries(D.statueFiles).forEach(([k, v]) => all['s-' + k] = v);
    Object.values(D.moments || {}).forEach(lista =>
      lista.forEach(m => (m.photos || []).forEach(f => all['mom-' + f] = f)));
    for (const name of new Set(Object.values(all))) {
      try { const fh = await tripDir.getFileHandle(name); zip.file(name, await (await fh.getFile()).arrayBuffer()); } catch (_) {}
    }
    const blob = await zip.generateAsync({ type: 'blob' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = (D.trip?.id || tripDir.name) + '-copia.zip';
    a.click();
    status('✓ Copia descargada');
  } catch (e) { status('No se pudo crear la copia: ' + e.message, true); }
}

async function toDataURL(url) {
  const blob = await (await fetch(url)).blob();
  return await new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(blob); });
}

/* ─── INSTALACIÓN (PWA) Y VERSIÓN ─── */
let installEvent = null, swReg = null, updateReady = false;

// El número de versión vive solo en sw.js: se lo preguntamos para no tenerlo apuntado en dos sitios.
function showVersion(v) {
  if (!v) return;
  const b = el('version');
  b.textContent = v.replace('bitacoras-', '');
  b.style.display = '';
}
function askVersion(reg) {
  const sw = reg.active || navigator.serviceWorker.controller;
  if (!sw) return;
  const canal = new MessageChannel();
  canal.port1.onmessage = e => showVersion(e.data && e.data.version);
  sw.postMessage('version', [canal.port2]);
}
function updateFound() {
  updateReady = true;
  const b = el('version');
  b.classList.add('nueva');
  b.title = 'Hay una versión nueva — toca para recargar';
  status('Hay una versión nueva — recarga la página para usarla');
}
async function checkUpdate() {
  if (updateReady) { location.reload(); return; }
  if (!swReg) { status('La versión solo se comprueba con la app abierta desde internet', true); return; }
  status('Buscando una versión nueva…');
  try {
    await swReg.update();
  } catch (e) { status('No se pudo comprobar: ' + e.message, true); return; }
  // update() no dice si encontró algo: hay que mirar si ha arrancado una instalación
  if (swReg.installing || swReg.waiting) status('Descargando la versión nueva…');
  else status('Ya tienes la última versión');
}
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', async () => {
    try {
      const reg = await navigator.serviceWorker.register('sw.js');
      swReg = reg;
      askVersion(reg);
      // En la primera visita aún no hay service worker activo cuando termina el registro
      navigator.serviceWorker.ready.then(askVersion);
      reg.addEventListener('updatefound', () => {
        const sw = reg.installing;
        sw && sw.addEventListener('statechange', () => {
          if (sw.state === 'installed' && navigator.serviceWorker.controller) updateFound();
        });
      });
    } catch (e) { status('No se pudo preparar el uso sin conexión: ' + e.message, true); }
  });
}
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); installEvent = e;
  const b = el('btn-install'); if (b) b.style.display = '';
});
window.addEventListener('appinstalled', () => { const b = el('btn-install'); if (b) b.style.display = 'none'; });
async function installApp() {
  if (!installEvent) { status('Tu navegador no ofrece la instalación aquí. Usa el menú ⋮ → Instalar.', true); return; }
  installEvent.prompt();
  await installEvent.userChoice;
  installEvent = null;
  el('btn-install').style.display = 'none';
}

        el('btn-root').removeAttribute('onclick');
        el('btn-root').onclick = async () => {
          if (pickerBusy) return;
          pickerBusy = true;
          let ok = false;
          try { ok = await ensurePermission(saved); } catch (_) {} finally { pickerBusy = false; }
          if (ok) {
            rootHandle = saved; await scanTrips();
            el('btn-root').onclick = pickRoot;
            showLibrary();
          } else {
            status('Permiso no concedido. Pulsa otra vez para elegir la carpeta a mano.', true);
            el('btn-root').textContent = '📁 Elegir carpeta';
            el('btn-root').onclick = pickRoot;
          }
        };
      }
    } catch (_) {}
  }
  showLibrary();
})();
</script>
</body>
</html>
